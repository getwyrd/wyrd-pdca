# pdca.toml — driver configuration for Wyrd PDCA.
# Read by pdca_harness.config; the only project-specific runtime config.
#
# Every key's full reference documentation lives upstream in the template
# (eduralph/pdca-harness `template/pdca.toml.jinja` + its `docs/`). What is kept here is the
# VALUES and, where a value is a decision rather than a default, the reason for it.

[project]
name = "Wyrd PDCA"
default_branch = "main"
# Default §9 sign-off attribution, so `flow`/`signoff` never need a --by.
author = "Eduard Ralph"

# The target repo's standing review rubric (issue #314) — a path RELATIVE TO THE TARGET
# CHECKOUT, optionally narrowed to one Markdown section. Unset (the default) leaves every
# model prompt byte-identical to today.
#
# The asymmetry it removes: the builder generates without ever seeing the criteria the
# reviewer applies, so a convention violation ships and returns as a finding — a
# guaranteed review round for something the builder could have fixed before emitting. One
# artifact reaches all three leaves (builder, reviewer, adversary), snapshotted per attempt
# so they cannot be judged against different versions of it.
#
# ON here. Wyrd's AGENTS.md § Review rubric & protocol is 89 lines — Hard conventions (MUST),
# Recurring defect classes (MUST check when the diff touches the surface), and the Reviewer
# protocol. It already reached the REVIEWER, through `scripts/review-branch` at the
# T4-batch-review gate. It did not reach the BUILDER, which is precisely the asymmetry above
# and the half `scripts/review-branch` itself names as owed ("the rubric-key half is #314").
#
# Available since harness v0.56.0 and left off until now; turned on with the v0.57.0 upgrade
# (#217) once the audit surfaced it. Three consumers share ONE snapshot per attempt
# (rubric-snapshot.md in the bundle) so builder, reviewer and adversary cannot be judged
# against different versions of it — and an iterate archives the snapshot with its round, so a
# rubric that changed between attempts applies to the next one.
#
# No conflict with the T4 gate: review-branch injects the rubric into its own codex passes,
# this feeds the harness's leaves. Same text, different readers.
#
# Fail-open by design: an unreadable path, a missing section or a path escaping the target
# degrades to "no rubric" with a warning, never a stopped build.
rubric_file = "AGENTS.md"
rubric_section = "Review rubric & protocol"   # ATX headings only (`## Heading`);
                                              # matched exactly or as a prefix.

[paths]
bundle_root = "results"
process_dir = "process"
templates_dir = "templates"

[driver]
# Worker-pool size for the UNATTENDED Do+Check band only (Plan, sign-off, publish and Act stay
# serial). Every ACTIVE gate is lane-safe, so `--lanes N` needs no extra setup: `C4-ci` runs in
# the driver's per-lane $PDCA_WORKTREE, and `C4-verify` scopes BOTH its ../wyrd-verify worktree
# and its pdca-verify branch by $PDCA_LANE. Any FUTURE gate that adds a container / port /
# scratch dir must likewise $PDCA_LANE-qualify it.
lanes = 2
# Sign-off passes one `pdca flow` run gets before it stops driving a bundle; the unfinished one
# is named on stderr with a resume hint and its accepted siblings still publish.
max_passes = 20
# Auto-iterate Do→Check while Check finds implementation-level work (a logic slip, a weak test,
# a red gate, or a judgment cell the reviewer tagged `[impl]`).
#
# A finding that needs a HUMAN no longer halts the rebuild (#332): it is deferred into the
# bundle's `deferred-findings.json` and re-enters §6 at handover, so on a mixed Check this
# instance runs up to the budget below unattended and the human sees the architectural finding
# when the rounds run out — later than before, never not at all. The C6 accept-guard still
# holds until every one is cleared, and it never auto-accepts.
#
# Two cases still halt IMMEDIATELY: an empty §6 (a clean bundle awaiting a human accept) and
# a §6 of human findings with no implementation work beside them (nothing to rebuild).
auto_iterate = true
# Two round budgets (issue #332). `soft_auto_iters` fires unconditionally — early rounds are
# allowed to get worse, since a builder that fixes one defect and uncovers two has made progress
# the finding count cannot see. Between the floor and `max_auto_iters` a round fires only while
# the implementation-finding count is not INCREASING; above the ceiling nothing fires. Past the
# floor the escalation ladder has the builder on opus/max, so spinning is expensive.
soft_auto_iters = 3
max_auto_iters = 5
# Run each cycle's Do/Check in a per-cycle git worktree off the target's base ($PDCA_WORKTREE),
# so the human's checkout is never mutated in place.
worktree = true
# Overflow worktrees (issue #226). The cap on concurrent EPHEMERAL "overflow" worktrees;
# 0 (default) disables. This reframes `lanes` above as a warm CACHED pool (reset-and-reused,
# build cache kept warm on the hot Do→Check path) and handles the EXCEPTIONAL read — a gate
# / re-gate for a bundle whose cached lane is currently owned by a DIFFERENT bundle (an
# out-of-cadence or contended read) — by spinning up a throwaway worktree off the base +
# that bundle's patch, running there, and removing it, instead of mutating a lane another
# bundle may still want. It's correct by construction (a fresh tree can't carry a foreign
# orphan, the #224 class of bug). Note every gating read now reconstructs base + patch.diff
# in the lane anyway (#296 — the lane is a warm checkout cache, not a trusted content
# cache); overflow's job is purely to avoid clobbering a lane another bundle still owns.
# At the cap it falls back to reconstructing in the lane in place. Leave at 0
# unless you actually run out-of-band gate/verify reads against in-flight lanes (the common
# serial / one-bundle-per-lane flow never contends, so 0 costs nothing). Each overflow is a
# full checkout — size the cap to your disk headroom; spillover is logged when it happens.
overflow = 0
# Wave sequencing. "stack" (fold each wave's accepted patches onto a run-scoped
# `pdca-integration/<base>` branch and open stacked PRs) kept the STOP discipline intact but
# used a force-rebuilt-each-fold branch as a PR base: any stacked PR still open at the next
# fold went stale — its old `pdca-integrate:*` commits fell out of the base's ancestry
# (host DCO red) and an overlapping later bundle turned it CONFLICTING against its own
# folded content (wyrd #675/#676, 2026-08-01). Wyrd is own-repo, so "merge": the driver
# `gh pr merge`s each NON-FINAL wave's PRs into the real base before the next wave builds —
# no run-scoped branch ever serves as a PR base, and C4-verify's `origin/<brief base>`
# matches the actual PR base (moots pdca-harness#273 here). The STOP relaxation is scoped:
# the final wave's PRs still wait for the human.
wave_mode = "merge"
# The `gh pr merge` strategy when wave_mode = "merge".
merge_method = "merge"
# But the driver does NOT merge (pdca-harness#462). Merge mode's *bases* are what this
# instance wants — real `main`, no run-scoped branch rewritten under an open PR — not its
# merging. Merging seconds after the PR opened is also what broke wyrd #703 (2026-08-08):
# `gh pr merge` refuses a PR whose required checks have not reported, so the wave stopped
# with one PR readied and three untouched. Off, every accepted bundle stays the draft
# publish opened, and a multi-wave batch STOPs after wave 0 for the human to merge and
# re-run. Turn back on once #462's `--auto`/poll fix lands upstream.
auto_merge = false
# Re-run the repo-scoped gates over each folded integration tip. Off: the PR's own CI is the
# merge-boundary check.

# Which checks must be green before wave_mode = "merge" merges a non-final wave's PR
# (issue #413). `gh pr merge` alone fails closed ONLY on the checks this host marks
# *required* in branch protection — so on a thinly-protected repo a red non-required job,
# or a run still in flight, merges anyway and the next wave builds on a base that never
# went green.
#   merge_requires = "all"       (default) — read the PR's FULL check rollup here, with
#       `gh pr checks`, AFTER the ready-mark (which can itself trigger `ready_for_review`
#       CI) and immediately before the merge; refuse — no merge, the run STOPs — on any
#       failing check, any pending/queued one, and on an EMPTY rollup (no checks reported
#       at all: absence of evidence is not green). Skipped/neutral checks are completed
#       non-failures and do not block. Refusing is cheap: re-run once CI is green and the
#       wave resumes idempotently.
#   merge_requires = "required"  — host-config-only semantics: skip that gate, so branch
#       protection is again the only backstop (and an empty rollup merges). Correct only
#       where the host's required checks really are the whole verification.
merge_requires = "all"
# Optional integration re-gate (#wave-model). After each wave folds (stack mode), run the
# repo-scoped gates over the folded integration tip before the next wave builds on it, so a
# combination that is red though each fix was green ALONE stops the run. Off by default
# (needs your repo-scoped gates); in merge mode the PR's own CI is the merge-boundary check.
regate_between_waves = false
# Act auto-runs in `pdca flow` once this many cycles have frozen SINCE the last Act review,
# counted across flow invocations. `pdca act log` runs it on demand; `--no-act` skips.
act_cadence = 5
# Scratch root for throwaway heavy leaf work, exported as both $PDCA_SCRATCH and $TMPDIR.
# Disk-backed deliberately (issue #134): /tmp on this host is a 31G tmpfs, and one overnight
# batch parked ~25G of dead cargo caches in RAM.
scratch_dir = "/var/tmp/pdca"

# Per-leaf memory bound (upstream #420, adopted at v0.57.0 — instance issue #199). Every leaf
# subprocess runs inside its own transient systemd scope capped here, so a leaf that overruns
# is killed AS ITSELF: it exits non-zero, the bundle records THAT leaf's failure, and the run
# survives to report it.
#
# What this replaces, and why the number is 16G: on 2026-08-02 systemd-oomd killed a run after
# 3d 19h. Two Check reviewers wrote ~69 GB of cold build trees in ~13 minutes and the page
# cache that generated pushed user@1000.service past oomd's stock 50%-pressure-for-20s
# threshold — so oomd killed the whole terminal CGROUP: driver, both lanes, both in-flight
# bundles, neither reviewer having produced a check-review.md. The interim fix was a
# `systemd-run --scope MemoryHigh=8G MemoryMax=16G MemorySwapMax=0 OOMPolicy=continue` prefix
# on [leaves.reviewer].argv; 16G is that wrapper's measured MemoryMax, kept.
#
# One thing IS lost in the swap: upstream has no MemoryHigh equivalent, so the soft-throttle
# half is gone and this bound is a kill, not a stall. That is the upstream design's deliberate
# trade — a leaf that dies as itself is diagnosable, where a session oomd took is not.
#
# DO NOT TIGHTEN WITHOUT MEASURING. On this host, 1 GiB written with conv=fsync: unconstrained
# 0.2s; High=8G/Max=16G 0.2s (no measurable penalty — the basis for these numbers);
# High=512M/Max=1G did not finish in 9 minutes. A window too small for the write burst turns a
# build into a writeback stall — a reviewer that hangs rather than one that fails.
#
# Budget: lanes = 2, and a lane can have its reviewer plus the advisory pool live at once, so
# the ceiling is 2 x (16 + 8 + 8) = 64G against 122 GiB of RAM. The advisory leaves carry
# smaller per-leaf caps (see [[leaves.advisory]] / [[leaves.plan_advisory]]) because that pool
# is what fans out concurrently; the four interactive leaves opt OUT entirely — a REPL a human
# works in for an hour is the one place a hard cap buys nothing and costs the session.
leaf_memory_max = "16G"

# Adjudicate a builder's unresolvable-dependency claim at BUILT (upstream #341). Wyrd's gates
# need FoundationDB, Docker, protoc, java, elle-cli and more, and every one of them already has
# a [[doctor.checks]] row below — which is exactly what this reads. Without it, a builder that
# hits a down FDB cluster still burns a full Check (reviewer + adversary + code-review) on a
# patch it has already declared unverifiable.
#
# On: the named dependency must resolve to a doctor row AND that row's detect cmd must exit
# non-zero. Confirmed => the bundle takes the close fast path to sign-off and stays RESUMABLE
# (install the dependency, answer iterate-do). Refuted (the cmd exits 0) or unresolvable =>
# the full Check runs unchanged and the refutation lands in §6 — a self-report never skips
# review on its own say-so, and sign-off still owns every terminal state.
#
# STRICT boolean: unquoted `true`, or it stays off.
dependency_halt = true

# Footprint sweep (issue #297). What `pdca flow` does with the harness's sibling
# worktrees once a run's waves complete (the publish/freeze boundary). Left unbounded,
# stale lane/integration/overflow trees and their build dirs (target/, node_modules, …)
# have accumulated >200 GB and false-redded GATING gates with 'Disk quota exceeded'
# mid-`cargo test` — an environment fault misattributed to the patch.
#   "clean"  (default) — strip lane worktrees of build state (`git clean -fdxq` +
#            `reset --hard`; the bulk of the footprint) but keep the checkouts warm;
#            remove integration + overflow trees outright (folds rebuild from the base
#            every call, so their reuse value is nil).
#   "remove" — remove lane worktrees too (Do / `pdca try` recreate them on demand).
#   "off"    — never sweep automatically; `pdca sweep` still reclaims on demand.
sweep_worktrees = "clean"
# Close-disposition fast path (issue #60). A bundle whose brief's `Disposition hint`
# matches one of these close / no-fix classes skips the builder + reviewer model leaves
# (the engine's only token spend) and routes straight to sign-off, where the human
# confirms or overrides the close. It is a HINT, not a gate: reopening to a fix path
# (iterate-to-Do) re-enables the full Do+Check band. Substring-matched, case-insensitive,
# against the disposition value. Retune this list to your tracker's vocabulary; omit it
# to use the built-in default shown here.
# close_dispositions = ["likely-close", "wontfix", "by-design", "duplicate", "not-reproducible", "manual-verification", "upstream", "external"]
# Pre-dispatch size advisory (#321): "off" (default) | "warn". With "warn" the driver
# prints an oversize note before Do, naming which signal fired, and proceeds. There is
# deliberately NO blocking mode: calibrated over 86 real bundles the structural signal
# peaks at 62% precision — nearly one wrong hold per right one — and a gate at that rate is
# one people learn to override.
#
# Placed at the END of [driver] but INSIDE it — a key after the next `[table]` header
# belongs to that table, so this sat in `publisher.checkouts` and `driver.size_guard`
# was absent: setting it to "warn" did nothing at all. Not beside `lanes` either, `copier update` merges
# three ways, so a NEW line adjacent to a line instances commonly edit (and `lanes` is the
# most edited in this table) lands as a git conflict marker in pdca.toml — after which
# every `pdca` command dies at config load. Add new keys here, away from the contested ones.
size_guard = "off"
# Do-exit halt on a BUILDER-declared unmet external dependency (#341) — opt-in, default
# off (byte-identical while off). The builder contract makes an honest builder declare a
# dependency it could not build/verify against (`NEEDS-HUMAN external dependency: …` in
# build-notes.md, plus a proposed [[doctor.checks]] row in a fenced ```toml block). With
# this on, the driver ADJUDICATES that claim deterministically at BUILT: the named
# dependency must resolve to a [[doctor.checks]] row (registered here, else the builder's
# proposed row) AND that row's detect cmd must exit non-zero. Confirmed ⇒ the bundle takes
# the close fast path to sign-off (N/A gates, no reviewer/adversary spent on a patch
# already stated to be unverifiable) and stays RESUMABLE — install the dependency and
# answer iterate-do; sign-off still owns every terminal state. Refuted (the cmd exits 0)
# or unresolvable/malformed ⇒ full Check runs unchanged, with the refutation recorded
# into §6 — a self-report can never skip review on its own say-so. STRICT boolean:
# write `dependency_halt = true` unquoted, or it stays off.
# dependency_halt = true
# Per-leaf memory bound (issue #420) — opt-in, unset by default. Every leaf subprocess the
# driver spawns (planner, builder, reviewer, advisory, sign-off, publisher, Act — headless
# and interactive alike) runs inside its own transient systemd scope capped at this value,
# so a leaf that overruns is killed AS ITSELF: it exits non-zero, the bundle records that
# leaf's failure, and the run survives to report it. Unbounded, it doesn't work that way —
# two concurrent reviewer leaves building cold trees pushed the session past the oomd
# pressure threshold and systemd-oomd killed the whole terminal CGROUP: driver, every lane,
# every bundle, with nothing in any gate log to say why (oomd kills the cgroup, not the
# offending process, so the driver just vanishes).
#   * a systemd byte value — "8G", "12G" — or a percentage of RAM ("50%");
#   * unset (the default) ⇒ NO wrapping and byte-identical argv, i.e. exactly today's
#     spawn. There is no portable number to default to, and a cap set too low is itself a
#     way to kill a run — size it against your leaves' real peak, not optimistically;
#   * a host with no usable `systemd-run --user --scope` (no systemd, no user manager, a
#     container, macOS) degrades to that same no-op with one note on stderr — never a hard
#     failure, and never a silent one;
#   * per-leaf override: `memory_max` under any [leaves.*] table (below) wins for that leaf;
#     `memory_max = "off"` there opts one leaf out of the driver-level bound entirely.
# leaf_memory_max = "8G"


# A-priori size-estimate weights + cutoffs (issues #320/#359). [driver.sizing] tunes the
# structural estimator that scores each brief BEFORE Do runs; the shipped defaults are
# calibrated against 86 settled bundles of a real instance, so this block is commented out
# — uncomment only the keys you retune, anything omitted keeps the shipped default. A
# sub-table: it must sit after every bare [driver] key (see the note above size_guard).
#
# RETUNING (#359) — walking a fresh `size-calibrate` run back into this table. The numbers
# only stay honest against YOUR corpus, and drift is visible in the Act index's per-cycle
# `sizing:` line (a-priori estimate vs measured outcome). At Act cadence:
#   1. Mine the instance:  PYTHONPATH=src scripts/size-calibrate   (add `--csv out.csv`
#      for the per-bundle table a threshold is actually argued from).
#   2. "Rank correlation … vs rounds": set each feature weight proportional to |rho|
#      against ROUNDS — churn is what the score predicts. A feature indistinguishable
#      from noise keeps weight 0; weighting it would be fitting noise.
#   3. "Median feature value, converged vs churned": put `brief_bytes_kb` at the knee
#      between the two medians (shipped: 12).
#   4. Set `watch` where the churn rate first clears your corpus base rate, `oversized`
#      where precision peaks (shipped: 4 / 7 at a 19% base rate).
#
# `model_weight` (#359): how much a sizer-leaf escalation (a watch/oversized verdict from
# [leaves.sizer]) adds to the numeric score. 0 — the default — is today's behaviour: the
# model raises the BAND only, escalate-only, and the score stays purely structural. It is
# config rather than a constant precisely so the Act-cadence review above can move it —
# but know the loop's blind spot before you do: the Act index's `sizing:` line carries
# the STRUCTURAL estimate only (the stored sizer verdict is not joined in), and
# size-calibrate mines no model-verdict feature, so escalation-vs-outcome correlation is
# not observable from either artifact yet. Until one of them grows that column — or you
# mine the bundles' sizing.json by hand — a retuning pass has no evidence that can
# justify moving model_weight off 0: leave it at 0 and record the gap in the Act notes
# rather than tuning it on taste.
# [driver.sizing]
# conflicts_with = 3
# difficulty_high = 3
# ext_deps = 3
# brief_bytes = 3
# is_plan_pointer = -2
# brief_bytes_kb = 12
# watch = 4
# oversized = 7
# model_weight = 0


# Empirical size backstop thresholds (issue #324). Measured at Check from the patch that
# actually arrived, unlike [driver.sizing] which guesses from the brief before a line is
# written — and much better at it: against "did this bundle churn >=3 rounds" over the same
# 86 settled bundles, patch >=100 KB scores 71% precision and >=20 files 86%, where the
# a-priori score peaks at 62%. Crossing a threshold raises a §6 NEEDS-HUMAN item (which
# disqualifies auto-iterate) recommending `iterate-plan`; it never blocks — at 70% precision
# for the union, roughly three firings in ten are a coherent large change.
#
# `rounds` fires at 2 while max_auto_iters above defaults to 3, so it deliberately stops the
# rebuild loop with a round still nominally available: the budget is a CEILING on how many
# rebuilds are worth attempting, and this is evidence that more rebuilds are the wrong move
# (76% of bundles at two rounds reach a third). The flow names this rule on stderr when it
# declines, so an early halt is never a mystery. Set any threshold to 0 to switch it off.
#
# Commented out because the defaults ARE the calibrated values; uncomment to retune against
# your own corpus with `scripts/size-calibrate`. A sub-table, so it must sit after every bare
# [driver] key — see the note above size_guard for what happens when that ordering slips.
# [driver.size_signal]
# patch_kb = 100
# patch_files = 20
# rounds = 2


# Install bootstrap (issue #207). `make install` runs scripts/bootstrap-tools.sh, which
# provisions the harness-universal tools (git, gh, a pip-capable venv) and the leaf backends
# your [leaves.*].family use. It hardcodes NO project gate toolchain — that is instance-owned.
# `extra_bootstrap` is one idempotent command the bootstrap runs LAST to provision THIS
# project's gate toolchain (e.g. rustup for a cargo-xtask gate, or `pip install .[test]` for a
# Python one); it survives `copier update` (config, not a template file). Empty ⇒ nothing.
# For multiple concerns, drop composable scripts into scripts/bootstrap-tools.d/*.sh instead.
[install]
# One idempotent command `scripts/bootstrap-tools.sh` runs LAST to provision this project's
# gate toolchain; for several concerns use scripts/bootstrap-tools.d/*.sh instead.
extra_bootstrap = ""

# `pdca try <id>` — materializes the patched tree from patch.diff and launches this from
# cwd=$PDCA_WORKTREE, inheriting the terminal, for the manual/visual §6 rows. Wyrd is not a GUI
# app, so it compiles the PATCHED build and runs the zero-setup in-memory put→get round-trip.
# Backend-specific manual repro (real TiKV / D-server) is `cargo xtask tikv-conformance` /
# `wyrd d-server`, run by hand from the same worktree. Advisory: it decides nothing.
[manual_test]
cmd = "cargo run -p wyrd-server --bin wyrd -- demo"

[tracker]
system = "github"
url = "https://github.com/getwyrd/wyrd"
issue_id_example = "#123"
# Trailer linking a commit/PR to the issue ({id} = the bug id). Trackers differ
# (GitHub/Mantis "Fixes #{id}", Jira "Fixes PROJ-{id}"); "" enforces none. The
# publish step's commit-msg ends with this; the T4 gate (if any) checks it.
# No tracker id yet? Use `pdca publish --no-issue`: it omits the trailer, runs T4
# in the narrow pending-id mode (only the tracker-id requirement is dropped — everything
# else still blocks), and records the bundle `id_pending` (no magic "#0000" placeholder).
issue_trailer = "Fixes #{id}"
# Deliberately EMPTY. GitHub already renders a bare `#<id>` as a cross-link, and only the bare
# `Fixes #<id>` form reliably triggers issue AUTO-CLOSE on merge — a `Fixes [#<id>](url)` link
# can leave the issue open (getwyrd/wyrd-pdca#96/#94, eduralph/pdca-harness#233). Set a URL only
# for a tracker that does not auto-link a bare id.
issue_url_pattern = ""
# Tracker scrape run before a Plan beat to seed the bundle's notes.json — Wyrd's tracker is
# GitHub Issues, so the source is the live ticket via `gh`. (Composable [[plan.source]]
# providers are available upstream if a brief ever needs more than the ticket.)
notes_cmd = "./engine/scripts/scrape-notes.sh {id}"

[publisher]
fix_branch_pattern = "fix/{id}-{slug}"
feature_branch_pattern = "enhancement/{id}-{slug}"
# Own-repo target: no fork/upstream split, so the fix branches off (and pushes to) origin.
base_remote = "origin"

[publisher.checkouts]
# Only the exceptions to the sibling default (`<project>/../<repo-last-segment>`). None needed:
# the target resolves to ../wyrd, and cycle isolation is native ([driver].worktree).

# The model leaves. mode = "command" runs `argv` with the leaf's prompt; `interactive = true`
# hands the terminal to the human instead. PDCA_LEAVES_MODE=stub forces the offline placeholders
# everywhere (CI / `make` determinism). `agent = "<name>"` names the role prompt: claude resolves
# it through `--agent` (the .claude/agents/<name>.md wrapper), inline families get the
# agents/<name>.md body prepended.
#
# `effort` is PINNED on every leaf rather than left to the vendor default, so a CLI default that
# moves cannot silently re-tier the cycle. The harness maps it through the family profile —
# claude `--effort <level>`, codex `-c model_reasoning_effort=<level>` — and never adds a flag
# argv already carries. The builder ladder climbs on BOTH axes, model and effort: sonnet/high →
# fable/high → opus/xhigh (the difficulty auto-route) → opus/max (the top pin and the iterate
# escalation). The non-builder leaves are pinned by ROLE: `xhigh` for the three deep judgment
# passes (the codex review and the adversary's refutation — depth there is what keeps findings
# out of the PR — plus Plan, whose brief sets up everything downstream), `high` for Act, `medium`
# on sonnet for the mechanical prose steps (sign-off, publish). A variant that omits `effort`
# INHERITS the base builder's, so every entry below states its own.
#
# The MODEL is pinned in argv for the builder tiers — a variant's `model` key is the #167
# SELECTOR name a brief matches, not a CLI model id — and through the `model` key for the plain
# leaves, which the profile maps to claude `--model` / codex `-m`.

# Do builder — writes patch.diff + the named test + build-notes.md in $PDCA_WORKTREE. The base
# tier is `sonnet` at high effort; difficulty=high auto-routes to `opus` at xhigh, and any
# iterate escalates to opus at max (all below).

# "<org/repo>" = "../<checkout-dir>"   # only the exceptions to the sibling default

# Result-bundle recording (issue #317) — `pdca record [<ids>…]` commits the
# bundles whose cycle is OVER (state COMPLETE / DISCONTINUED / RESOLVED; never a bundle
# in motion or one halted for a human) to THIS instance repo as one batch commit, so a
# bundle's provenance stops living on one machine only. Publish also triggers it,
# strictly after its publish.json write. Off by default — enable it only if this
# instance versions its bundle_root (results/).
# ON here (v0.57.0): this instance versions results/, and recording it by hand does not keep
# up — the 0.57 upgrade itself opened with a `chore(bundles)` commit for 17 accumulated
# bundles, because `copier update` refuses a dirty tree. That is the hand step this removes.
#
# "commit", not "pr": this repo IS the instance, records are provenance rather than a change
# anyone reviews, and a PR per batch would add a review step for content nobody reads. The
# `branch` / `issue` keys are pr-mode only and stay at their defaults.
[records]
mode = "commit"
subject = "chore(records): record {n} result bundle(s)"

# The six model leaves (docs 03 §Implementation substrate). mode = "stub" runs
# the offline placeholders (no model/TTY) so the driver works without a model;
# mode = "command" runs `argv` as a subprocess with the leaf's prompt. `interactive
# = true` hands the terminal to the human (a seeded `claude "<prompt>"` REPL, no
# -p); a headless leaf runs autonomously (`claude -p …`) and writes its artifact.
# Set PDCA_LEAVES_MODE=stub to force stubs everywhere (CI / `make` determinism).
#
# Any leaf table below also takes `memory_max = "8G"` (issue #420) — this leaf's own
# memory bound, overriding [driver].leaf_memory_max for it alone; `memory_max = "off"`
# opts it out of a driver-level bound. Omit it (the default) to inherit that bound. A
# reviewer that re-verifies red→green on a cold tree is the leaf that needs the most
# headroom; an interactive REPL the human works in for an hour is the one most likely
# to want "off". "Any" includes the ARRAY-form tables: [[leaves.advisory]] and
# [[leaves.plan_advisory]] each take their own (that pool is what a run fans out
# CONCURRENTLY, so it is the usual place to spend a smaller cap), while
# [[leaves.builder_variant]] / [[leaves.builder_escalation]] / [[leaves.sizer_escalation]]
# INHERIT the leaf they vary unless they set their own — a variant is the same appetite
# as its base leaf, and must not silently lose its cap or its "off".
#
# Headless leaves ----------------------------------------------------------------
# Do builder — writes patch.diff + test + build-notes.md:

[leaves.builder]
mode = "command"
family = "claude"
interactive = false
agent = "builder"
effort = "high"
argv = ["claude", "-p", "--agent", "builder", "--permission-mode", "acceptEdits", "--allowedTools", "Read,Edit,Write,Bash,Grep,Glob", "--model", "sonnet"]

# Escalation ladder (issue #135): from the 2nd attempt on, opus at MAX effort — the same backend
# as the `opus-max` pin, which is what keeps escalation >= every first-attempt tier. It has to
# outrank the auto-route (opus/xhigh), or a `high` bundle would iterate onto the tier it just
# failed on. The ladder overrides the difficulty variant.
[[leaves.builder_escalation]]
min_iteration = 2
effort = "max"
argv = ["claude", "-p", "--agent", "builder", "--model", "opus", "--permission-mode", "acceptEdits", "--allowedTools", "Read,Edit,Write,Bash,Grep,Glob"]

# Builder model menu (issues #134/#167), cheapest first. A brief pins one explicitly with
# `- **Do model:** <name>`; only the `opus` entry carries a `when`, so it is the sole auto-route
# and the rest are pin-only. Each inherits any field it omits from [leaves.builder].

# sonnet — force the base tier even on a `high` bundle (overrides the difficulty auto-route).
[[leaves.builder_variant]]
model = "sonnet"
effort = "high"
argv = ["claude", "-p", "--agent", "builder", "--permission-mode", "acceptEdits", "--allowedTools", "Read,Edit,Write,Bash,Grep,Glob", "--model", "sonnet"]

# fable — the Claude 5 family builder (`claude-fable-5`), pin-only. A third first-attempt tier
# between sonnet and opus, and a model-family change rather than a size change, so it is also the
# way to retry a bundle whose failures look like one lineage's blind spot.
[[leaves.builder_variant]]
model = "fable"
effort = "high"
argv = ["claude", "-p", "--agent", "builder", "--permission-mode", "acceptEdits", "--allowedTools", "Read,Edit,Write,Bash,Grep,Glob", "--model", "fable"]

# opus — the difficulty=high auto-route (first attempt), at xhigh effort. The `substring` list
# matches either difficulty word, keeping "high blast radius" one concept with the adversary
# gate below.
[[leaves.builder_variant]]
model = "opus"
effort = "xhigh"
when = { field = "difficulty", substring = ["high", "hard"] }
argv = ["claude", "-p", "--agent", "builder", "--permission-mode", "acceptEdits", "--allowedTools", "Read,Edit,Write,Bash,Grep,Glob", "--model", "opus"]

# opus-max — the deepest tier, and the escalation target above. `--effort max` IS the mechanism
# (Claude Code 2.1.218 `--effort low|medium|high|xhigh|max`); it replaced the
# MAX_THINKING_TOKENS=31999 wrapper this entry carried as `opus-xhigh`, back when the claude
# family had no reasoning-effort flag. A brief that still pins the old `opus-xhigh` name matches
# nothing and falls back to the base builder — rename the pin when you see one.
[[leaves.builder_variant]]
model = "opus-max"
effort = "max"
argv = ["claude", "-p", "--agent", "builder", "--model", "opus", "--permission-mode", "acceptEdits", "--allowedTools", "Read,Edit,Write,Bash,Grep,Glob"]

# codex — cross-vendor builder, OPT-IN and BEST-EFFORT: codex is verified end-to-end here only
# as the read-only reviewer, so a write-heavy codex builder is unsmoke-tested (notably whether it
# writes build-notes.md into the bundle dir outside its sandbox cwd). Its CLI model rides in argv
# (`-m`), NOT in the `model` key — that key is the selector name a brief pins, so this is the one
# tier where the two meanings collide and only argv can carry the pin.
[[leaves.builder_variant]]
model = "codex"
family = "codex"
agent = "builder"
effort = "high"
argv = ["codex", "exec", "--sandbox", "workspace-write", "--skip-git-repo-check", "-m", "gpt-5.6-sol"]

# Check reviewer (advisory; build-notes withheld via a sandbox). Cross-vendor decorrelation
# (INTEGRATION §4): this leaf runs a DIFFERENT family from the builder, so the reviewer does not
# grade its own homework. Keep it that way — the same-vendor fallback costs that decorrelation.
# The model is pinned rather than left to codex's own default, for the same reason effort is: the
# review tier must not move under us when the CLI's default does.


# Builder escalation ladder (issue #135) — optional. A bundle that fails Check and
# iterates re-runs the builder; without escalation it re-fails with the same model until
# you discontinue. Declare stronger backends keyed on the attempt number; do_build picks
# the entry with the highest `min_iteration` <= the current attempt (so a hard bundle
# can't loop forever on an underpowered executor). Each entry inherits any field it omits
# from [leaves.builder]. Iterations-to-pass + which backend ran each pass (family plus the
# effective model/effort, so a ladder INSIDE one vendor stays readable) land in the
# bundle's loop-telemetry.json — the go/no-go metric for adopting a cheaper local builder.
# [[leaves.builder_escalation]]
# min_iteration = 2          # 2nd attempt onward → a stronger model
# argv = ["claude", "-p", "--agent", "builder", "--model", "opus", "--permission-mode", "acceptEdits", "--allowedTools", "Read,Edit,Write,Bash,Grep,Glob"]
# Difficulty-routed builder variants (issue #134) — optional. Route the Do backend per
# bundle from the brief's `Difficulty` field (the planner's blast-radius assessment, #133),
# so a cheap local model handles easy bundles and a stronger one is reserved for the hard
# ~20%. Each entry's `when = {field, substring}` matches a brief field (like a gate target);
# the FIRST match wins, an absent/unknown field falls back to [leaves.builder] (default-open
# — a missing tag never reduces capability), and the escalation ladder above OVERRIDES the
# variant on iterate. SAFETY: calibrate before you narrow — run the would-be-skipped path on
# a sample of low/medium bundles and confirm ~0 NEEDS-HUMAN on "low" before trusting it.
# A variant may also carry `model = "<name>"` so a brief pins it EXPLICITLY via
# `- **Do model:** <name>` (issue #167) — an explicit per-bundle choice that OVERRIDES the
# `when` routing (e.g. force a privacy-sensitive bundle onto a local backend regardless of
# difficulty); a `Do model` naming no variant `model` falls back to the `when` routing.
# [[leaves.builder_variant]]
# model = "frontier"
# when = { field = "difficulty", substring = "high" }
# argv = ["claude", "-p", "--agent", "builder", "--model", "opus", "--permission-mode", "acceptEdits", "--allowedTools", "Read,Edit,Write,Bash,Grep,Glob"]
# Check reviewer (advisory; build-notes withheld via a sandbox). Cross-vendor
# decorrelation is the default and the ideal — a DIFFERENT family from the builder
# (INTEGRATION §4). `--agent reviewer` (same family as the builder) is the
# documented FALLBACK only; it weakens the independence Check relies on.
# The cheap-model SIZE judgment (issue #320) — advisory, optional, off by default.
#
# Answers the one question the structural estimator provably cannot: how many
# INDEPENDENTLY SHIPPABLE outcomes does this brief describe? Structure (sizing.py,
# calibrated against a real 86-bundle corpus) predicts patch size well and churn weakly;
# neither tells you whether a slice DECOMPOSES, and that is what justifies a split.
#
# `mode = "stub"` ships deliberately: taking a `copier update` must never switch on a model
# call — and a per-Plan cost — an instance did not ask for. Switch to "command" to enable.
# Its verdict can only ever RAISE the driver's band, never lower it (sizing.combine).
# The SPLITTER (issue #322) — interactive, invoked by `pdca split <id>`.
#
# Reads brief.md plus the driver's size estimate and writes exactly ONE file,
# split-proposal.md: N child slices, each a full draft brief, each carrying `Depends on:` /
# `Conflicts with:` naming its SIBLINGS by proposal-local label. Those ordering fields are
# the point — get them right and `compute_waves` needs no new code: independent children
# run in one parallel wave, dependent ones stack.
#
# It proposes seams and never cuts them: no bundles, no branches, no tracker calls.
# `pdca split <id> --accept` is the deterministic half: it files one tracker issue per child
# as a SUB-ISSUE of the parent, materializes a bundle each, and the run continues into waves
# by itself (#358). Pass `--ids 640,641` instead when the issues already exist — or when the
# tracker is not a GitHub one this can reach, in which case it says so rather than skipping.
# `mode` MUST be "command" here: `do_split` falls to the offline placeholder for any other
# value, silently and with rc 0, and nothing downstream can tell that proposal from a real
# one — `--accept` filed the fixture children as real tracker sub-issues once already
# (getwyrd/wyrd#708/#709, upstream #466). Leave it stubbed only where `--ids` is always
# supplied, i.e. the offline round-trip test.
[leaves.splitter]
mode = "command"
family = "claude"
interactive = true
agent = "splitter"
model = "fable"
effort = "high"
argv = ["claude", "--agent", "splitter", "--permission-mode", "acceptEdits"]

[leaves.sizer]
# Switch `mode` to "command" to enable — the argv below is ACTIVE so that one edit is
# enough. `--allowedTools Read Write`: the leaf reads brief.md and must WRITE sizing.json,
# and a Read-only grant would let it run and produce nothing.
mode = "stub"
family = "claude"
interactive = false
agent = "sizer"
argv = ["claude", "-p", "--agent", "sizer", "--allowedTools", "Read", "Write", "--model", "haiku"]

# Escalation on the sizer's OWN first-pass verdict — runtime state, not a brief field,
# which is why this is an escalation rather than a variant. A `watch` or low-confidence
# answer is exactly when a stronger model earns its cost; nothing in the brief predicts it.
# At most one escalation runs: this is a corroborating signal, not a search.
#
# [[leaves.sizer_escalation]]
# on_band = ["watch"]
# on_confidence = ["low"]
# effort = "medium"
# argv = ["claude", "-p", "--agent", "sizer", "--allowedTools", "Read", "Write", "--model", "sonnet"]

[leaves.reviewer]
mode = "command"
family = "codex"
interactive = false
agent = "reviewer"
model = "gpt-5.6-sol"
effort = "xhigh"
# The memory bound this leaf needs is no longer an argv prefix. It used to be a
# `systemd-run --scope MemoryHigh=8G MemoryMax=16G MemorySwapMax=0 OOMPolicy=continue`
# wrapper (issue #199) after systemd-oomd killed a 3d 19h run on 2026-08-02: two reviewers
# wrote ~69 GB of cold build trees in ~13 minutes and the page cache that generated pushed
# user@1000.service past oomd's stock pressure threshold, taking the whole terminal cgroup —
# driver, both lanes, both bundles. That wrapper was explicitly interim, "drop when
# eduralph/pdca-harness#420 lands upstream". It landed in v0.57.0, so the bound is now
# `[driver].leaf_memory_max` above (with a per-leaf `memory_max` override) — driver-owned,
# vendor-neutral, and it leaves argv[0] = codex for `pdca doctor` to read.
#
# `codex exec --sandbox workspace-write` — the reviewer re-runs red/green evidence
# (git stash/unstash) and re-checks path:line on $PDCA_TARGET, which the driver grants as a
# writable root via the family's --add-dir grounding. The role prompt forbids writing the FIX.
# --skip-git-repo-check: the reviewer's cwd is a temp SANDBOX (not a git repo), which codex
# exec otherwise refuses to run in ("Not inside a trusted directory").
argv = ["codex", "exec", "--sandbox", "workspace-write", "--skip-git-repo-check"]

# Interactive leaves — the human-in-the-loop touch points (Plan, sign-off, publish, Act) hand
# the terminal to a seeded model+human REPL, chosen by `interactive_family` (claude),
# independent of the builder/reviewer families above.
#
# REMOTE CONTROL — answer an interactive leaf from another device (issue #176; upstream #337).
#
# The four leaves below BLOCK on a REPL, so without this the human must sit at the terminal
# the flow runs in, for the whole batch: a `pdca flow` over six bundles can park on one
# sign-off adjudication for hours because nobody is at that machine. The driver launches every
# leaf as its own `claude` subprocess with argv taken straight from this file, so enabling
# Remote Control in your OWN shell does not reach them — which is why the flag lives here.
# Everything else is unchanged: `signoff-decision`, the §6 ticks and the C6 accept-guard run
# the same code path; only the human's location differs. Each leaf is NAMED so the phone shows
# which one is asking rather than four identical sessions.
#
# ENABLED on this instance (live since 2026-07-30, #176) — the template default is off,
# because a flag that made a leaf refuse to start would block the flow on the one path that
# cannot be retried unattended. To change a leaf, APPEND the flag to its existing argv line —
# do not add a second `argv = [...]`, which is a duplicate key and a TOML parse error that
# kills every `pdca` command at config load.
#
# Put it anywhere but LAST (upstream #396): the driver seeds each interactive leaf by
# appending the prompt as one positional after this argv, and `--remote-control` takes an
# optional [name] value — as the final token it swallows the seed as the RC session name (RC
# then fails with "check the debug log" and the REPL opens unseeded). That holds for ANY flag
# with an optional value, so none may sit last. The claude spawn inserts `--` before the seed
# as a backstop; non-last placement is the posture every family supports.
#
#   argv = ["claude", "--remote-control", "planner", "--agent", "planner",
#           "--permission-mode", "acceptEdits"]
#
# Requires the device to be enrolled (`/login`). CLAUDE-ONLY, and interactive-only: the
# headless builder/reviewer must NOT carry it — the flag starts an INTERACTIVE session and
# they have no human to reach.

[leaves.planner]
mode = "command"
family = "claude"
interactive = true
agent = "planner"
model = "opus"
effort = "xhigh"
# Opted OUT of [driver].leaf_memory_max (#420): an interactive REPL a human works in for an
# hour is the one leaf where a hard cap buys nothing — there is no unattended runaway to
# contain, and being killed mid-session costs the human the context, not just a retry.
memory_max = "off"
argv = ["claude", "--agent", "planner", "--permission-mode", "acceptEdits", "--remote-control", "pdca planner"]

[leaves.signoff]
mode = "command"
family = "claude"
interactive = true
agent = "signoff"
model = "sonnet"
effort = "medium"
# Opted OUT of [driver].leaf_memory_max (#420): an interactive REPL a human works in for an
# hour is the one leaf where a hard cap buys nothing — there is no unattended runaway to
# contain, and being killed mid-session costs the human the context, not just a retry.
memory_max = "off"
argv = ["claude", "--agent", "signoff", "--permission-mode", "acceptEdits", "--remote-control", "pdca signoff"]

[leaves.act]
mode = "command"
family = "claude"
interactive = true
agent = "act"
model = "opus"
effort = "high"
# Opted OUT of [driver].leaf_memory_max (#420): an interactive REPL a human works in for an
# hour is the one leaf where a hard cap buys nothing — there is no unattended runaway to
# contain, and being killed mid-session costs the human the context, not just a retry.
memory_max = "off"
argv = ["claude", "--agent", "act", "--permission-mode", "acceptEdits", "--remote-control", "pdca act"]

# Publisher — Check's closing step: writes commit-msg.txt + pr-description.md only; the git and
# draft-PR mechanics are deterministic code in pdca_harness.publish.
[leaves.publisher]
mode = "command"
family = "claude"
interactive = true
agent = "publisher"
model = "sonnet"
effort = "medium"
# Opted OUT of [driver].leaf_memory_max (#420): an interactive REPL a human works in for an
# hour is the one leaf where a hard cap buys nothing — there is no unattended runaway to
# contain, and being killed mid-session costs the human the context, not just a retry.
memory_max = "off"
argv = ["claude", "--agent", "publisher", "--permission-mode", "acceptEdits", "--remote-control", "pdca publisher"]


# FAMILY PROFILES (vendor neutrality). Every vendor-CLI-specific behavior is DATA
# (pdca_harness.families): how to stream, how to grant an extra read dir, how a role
# prompt is injected, whether the CLI must run from the harness root, whether it has
# its own STOP-discipline hook. Built-ins ship for claude / codex / gemini / generic;
# any UNKNOWN family name falls back to generic (prompt on stdin, no vendor flags),
# and a non-claude BUILDER automatically gets the driver's `gh` PATH-shim guard —
# the same builder_guard.py rules as claude's PreToolUse hook, vendor-neutrally.
# Override or extend per instance; adding a vendor is config, not a driver change:
# [families.mycli]
# grounding_flag = "--include-directories"   # "" ⇒ env-only ($PDCA_TARGET/$PDCA_WORKTREE)
# role_injection = "inline"                  # "flag" | "inline" | "none"
# stream_argv = []                           # flags for a live tool-use stream, if any
# cwd_discovery = false                      # true ⇒ run from harness root (claude-style)
# native_guard = false                       # true ⇒ skip the driver's gh PATH shim
#
# Any leaf may also carry, mapped through its family's profile (explicit argv wins):
#   agent  = "reviewer"   # role prompt: canonical body is agents/<name>.md. Claude passes
#                         # `--agent <name>` (reads .claude/agents/<name>.md, the frontmatter
#                         # wrapper generated from that body); inline families read the
#                         # agents/<name>.md body and prepend it to the task prompt
#   model  = "<id>"       # → the profile's model_flag (claude --model, codex/gemini -m)
#   effort = "high"       # → the profile's effort_argv mapping

# Vendor behaviour is DATA, not driver code (pdca_harness.families): built-in profiles ship for
# claude / codex / gemini / generic, an unknown family falls back to generic, and adding or
# overriding a vendor is a `[families.<name>]` table here.

# The ADVERSARIAL reviewer (issue #151) — the refutation lens: it tries to DISPROVE the red→green
# evidence and the reviewer's verdict, defaulting to "refuted" when uncertain. Advisory (its
# `- NEEDS-HUMAN —` findings route into SUMMARY §6; it never gates), and gated to the highest
# blast-radius bundles. Decorrelated by ROLE from the codex reviewer (adequacy vs refutation),
# which is why no separate codex advisory exists. Live since 2026-07-04. List-`substring`
# matching in `_when_matches` is staged locally, pending upstream.
[[leaves.advisory]]
id = "adversary"
role = "refute the red→green evidence and the reviewer's verdict; find the input that breaks the fix"
mode = "command"
family = "claude"
model = "opus"
effort = "xhigh"
argv = ["claude", "-p", "--agent", "adversary", "--permission-mode", "acceptEdits", "--allowedTools", "Read,Bash,Grep,Glob"]
# Half the reviewer's bound (#420): this pool is what a run fans out CONCURRENTLY, so it is
# where a per-leaf cap earns the most. An adversary re-runs evidence but does not carry the
# reviewer's full re-derivation appetite.
memory_max = "8G"
when = { field = "difficulty", substring = ["high", "hard"] }
# Opt into `[leaves.advisory_selection] mode = "vendor-complement"` to run only the advisory leaf
# whose family differs from the builder that actually ran (issue #200).

# Plan-beat advisory reviewers (issue #301) — the same open-list mechanism at PLAN: right
# after the planner writes brief.md, each [[leaves.plan_advisory]] leaf reviews the BRIEF
# (brief + notes + sources — no patch exists yet) as an ANTAGONIST of the plan: wrong
# root-cause framing, an unverifiable success criterion, hidden scope, an unresolvable
# target/dependency, ignored tracker context. Findings are `- NEEDS-HUMAN —` bullets in
# plan-advisory-<id>.md; the planner then gets ONE bounded revision pass, and the bundle
# records plan-advisory-benefit.json (findings count + whether the brief was revised) —
# surfaced in SUMMARY §10 so Act can judge over cycles whether plan reviews pay off, and
# as a §6 item when findings were left unrevised. Add extra vendor entries (a codex/gemini
# `family` + argv) to build a VENDOR POOL; with the selection below the driver runs the
# single leaf whose family differs from the PLANNER's (the brief's author — pre-Do there
# is no builder telemetry), so plan validation is cross-vendor automatically; no
# different-family leaf ⇒ same-vendor fallback + a decorrelation note. Advisory — never
# gates; off (commented) by default.
# ENABLED 2026-08-09 (was off). Three deliberate departures from the commented default above:
#
#   1. `mode = "command"`, not the default's `mode = "stub"`. The stub is the offline
#      placeholder — it writes a canned artifact and reviews nothing. Enabling the block
#      verbatim would have produced a plan-advisory file per bundle, a benefit record, and a
#      §10 line, all attesting to a review that never happened. Worse than off, because it
#      looks like coverage.
#   2. `family = "codex"`, not the default's `claude`. [leaves.plan_advisory_selection] below
#      anchors vendor-complement on the PLANNER's family, and [leaves.planner] is claude — so
#      a claude entry is the ONLY entry, fails to decorrelate, and runs same-vendor with a
#      decorrelation note (leaves.py:_select_plan_advisory). Codex is what makes the pass
#      genuinely cross-vendor, matching the Check-side reviewer's family.
#   3. NO `when` gate (the default gated on `difficulty` containing "high"). That gate is
#      CIRCULAR: `difficulty` is a field the PLANNER writes, so gating the planner's review on
#      it lets a mis-rated brief route itself away from the review that would catch the
#      mis-rating. This is not hypothetical — on 2026-08-09 the #692 re-plan rated child #717
#      `medium` (12 files, 6 crates, a live-path struct change dropping `Copy`); under the
#      gated default that brief, the one most needing an antagonist, would have been skipped.
#      Ungated, every brief gets one pass. It is advisory and never gates, so the cost is one
#      codex pass per NEW-or-REWRITTEN brief, not per cycle.
#
# Revert by re-commenting both tables; nothing else depends on them.
[[leaves.plan_advisory]]
id = "plan-reviewer"
role = "refute the brief: wrong root cause, untestable success criterion, hidden scope"
mode = "command"
family = "codex"
agent = "plan-reviewer"
model = "gpt-5.6-sol"
effort = "xhigh"
# Same reasoning as [[leaves.advisory]] — a concurrent pool leaf, and this one reads a BRIEF,
# not a build tree.
memory_max = "8G"
argv = ["codex", "exec", "--sandbox", "workspace-write", "--skip-git-repo-check"]

[leaves.plan_advisory_selection]
mode = "vendor-complement"   # anchor: the PLANNER family (the brief's author)

# Sandbox grants for the Check leaves (issue #276). BOTH keys live under this ONE table — a
# second [leaves.sandbox] header makes tomllib refuse the file and the driver will not start.
#
#   claude  unsandboxed_commands  ONLY the NAMED commands leave the sandbox (filesystem too);
#           every other command the leaf writes stays confined. The bound is enforced, not
#           merely intended: the harness seeds sandbox.enabled + failIfUnavailable = true,
#           allowUnsandboxedCommands = false, and runs the leaf with `--setting-sources project`
#           so your own ~/.claude settings cannot widen the list. The one scope it CANNOT bound
#           is enterprise managed policy (always loaded, arrays only concatenate). Cost of that
#           confinement: user-scope AUTH (apiKeyHelper / ANTHROPIC_API_KEY) must move into the
#           environment or the leaf fails to start.
#   codex   network_access        opens the SOCKET/NETWORK layer for EVERY command in the leaf
#           (the filesystem stays confined). ON here because codex's workspace-write has no
#           per-command escape and its docker-socket refusal is the seccomp/network layer — no
#           path grant substitutes — which is what lets the reviewer run the Docker-backed
#           conformance legs and reach api.github.com (#277). Must be an UNQUOTED boolean.
#
# Neither is meaningful protection against a ROOT-OWNED docker daemon (anything that reaches
# that socket can `-v /:/host`); rootless podman/dockerd is the real hardening.
[leaves.sandbox]
# unsandboxed_commands = ["cargo xtask fdb-conformance", "cargo xtask etcd-conformance"]  # claude
network_access = true                                                                      # codex

# Doctor rows (`pdca doctor`) — instance prerequisites, on top of the checks the doctor derives
# from this file (leaf CLIs + auth, gh, bundle root, notes_cmd). Each cmd runs from the project
# root; exit 0 = OK. Every row is WARN by design: the default `cargo xtask ci` path is Rust-only
# with every backend feature off and no Docker, so a missing tool preflight-warns the operator
# running that opt-in leg instead of failing the doctor for everyone.
#
# The built-in workspace section also WARNs when free disk space under the project root
# drops below [doctor].min_free_gb GiB (issue #297 — quota exhaustion mid-gate produces
# an arbitrary failing test name, misattributed to the patch). 0 disables the row.
# [doctor]
# min_free_gb = 10.0
# Each cmd runs from the project root; exit 0 = OK. A row a brief's `External
# dependencies` token names is ALSO executed by the pre-dispatch dependency guard
# ([driver].dependency_guard, default "hold"): a non-zero exit holds that bundle before
# Do dispatches, quoting the row's hint. Those detect cmds run on every beat the policy
# is consulted — not just on `pdca doctor` — so keep them cheap and
# side-effect-free: a probe is a read, never a provisioning step
# ([install].extra_bootstrap owns provisioning). Fields:
#   group     optional section header the row prints under (e.g. "engine")
#   level     status when the cmd FAILS — "WARN" for optional, default "MISSING"
#   required  a failing required row makes the doctor exit non-zero
#   per_lane  expand the row once per [driver].lane: {lane} → 0..lanes-1,
#             {lanes} → the count (nothing when lanes ≤ 1). {lanes} substitutes
#             in every row, so a hint can read "make worktrees LANES={lanes}".
# [[doctor.checks]]
# group = "engine"
# id = "docker"
# cmd = "docker info"
# hint = "https://docs.docker.com/engine/install/ — the gates run in a container"
# level = "WARN"
# [[doctor.checks]]
# group = "workspace"
# id = "lane worktrees lane{lane}"
# cmd = "test -e ../repo-lane{lane}/.git"
# hint = "make worktrees LANES={lanes}"
# per_lane = true
# level = "WARN"

# Deterministic Check gates (docs 04). Each check runs a shell command; it PASSES
# iff the command exits 0. `scope = "repo"` runs against the working tree (and is
# what CI re-runs via `pdca gates --working-tree`); `scope = "bundle"` needs the
# bundle/patch context ($PDCA_BUNDLE is exported) and runs only locally. The
# SAME commands run for the local driver and CI — single-sourced, no drift.
# With worktree isolation on ([driver].worktree), $PDCA_WORKTREE is also exported —
# the isolated tree Do edited; a bundle-scoped gate should test THAT, not the host
# checkout (e.g. `cd "$PDCA_WORKTREE" && <run the test>`).
#
# TARGET-AWARE SELECTION (optional). A check may carry `target` — a label or a LIST;
# it runs iff its labels are a SUBSET of the bundle's label set (subset = AND). The
# bundle is classified from its brief on two axes:
#   * PRIMARY (mutually exclusive, e.g. core vs addon): `[gates.target_match]` maps a
#     label → substring matched (case-insensitively) against "Repo + branch target",
#     `target_default` is used when none match.
#   * FLAGS (additive, e.g. frontend): `[gates.target_flags]` maps a label →
#     {field, substring} matched against ANY brief field (a bare string ⇒ the
#     "Repo + branch target" field).
# Unset ⇒ no filtering (every gate runs). E.g. skip core suites on an addon-only fix,
# and run a GUI/E2E gate only for a *frontend* change (core OR addon):
#   [gates]
#   target_default = "core"
#   [gates.target_match]
#   addon = "addons-source"
#   [gates.target_flags]
#   frontend = { field = "surfaces", substring = "gui" }
# then tag gates: core suite `target = "core"`, addon suite `target = "addon"`, GUI
# smoke `target = "frontend"`, an addon-in-GUI E2E `target = ["addon", "frontend"]`.
# `pdca gates --working-tree` (no bundle) is never filtered, so the CI re-gate is unaffected.
#
# While `checks` is empty the driver uses built-in all-PASS stubs so the offline
# slice runs. Fill these in as your gate tiers get written (gates are the long
# pole — build them first). Gate commands live in your project's verification
# engine under `engine/` (see engine/README.md). Example:
#
# C4 — the per-fix CORRECTNESS gate (bundle-scoped, GATING). Applies the bundle's
# patch.diff and runs ONLY its test, asserting red-without-fix / green-with-fix.
# This is what makes a cycle mean something — it validates THIS change.
# [[gates.checks]]
# id = "C4-verify"
# tier = "C4"
# label = "fix verified: test red pre-fix, green post-fix"
# cmd = "./engine/scripts/run-verify.sh"
# gating = true
# scope = "bundle"
#
# T3 — a whole-suite runtime gate on the UNMODIFIED tree. Ship it ADVISORY
# (gating = false): a checkout with any pre-existing failure is red as a baseline
# and never sees the bundle's patch, so it cannot gate a single fix — C4-verify
# above is the per-fix gate. Re-gate once the suite is green-baseline.
# [[gates.checks]]
# id = "T3-suite"
# tier = "T3"
# label = "runtime: whole test suite (baseline)"
# cmd = "./engine/scripts/run-suite.sh"
# gating = false
# scope = "repo"
#
# A reference C5 ADVISORY check (issue #154): does the bundle's shipped test exercise
# PRODUCTION, or a hand-ported copy? The script asserts each added test file in the patch
# imports the production package (PDCA_PROD_PACKAGE = the production import root, e.g.
# `gramps`); when it can't confirm it declares itself UNVERIFIABLE → SUMMARY §6 for the
# human to adjudicate. A Python/import heuristic — tune the package + test-file pattern.
# [[gates.checks]]
# id = "C5-prod-path"
# tier = "C5"
# label = "test exercises the production path (not a copy)"
# cmd = "PDCA_PROD_PACKAGE=yourpkg python3 scripts/checks/test_exercises_production.py"
# gating = false
# scope = "bundle"
#
# GATING POLICY (learned the hard way): default a tier to ADVISORY (gating =
# false). The per-fix C4 (red→green) is the one gate that ships gating = true —
# runtime, conformance (T1/T2/T4), and interface/E2E tiers all audit code the
# *current* fix did not introduce, so gating them on pre-existing/legacy
# non-conformance is wrong. Promote a tier to gating once its targeted artifacts
# are clean — give a check `promote_after = N` and `pdca gates --promotions` lists the
# advisory checks that passed in their N most-recent frozen cycles (earned promotion; you
# flip `gating`, nothing is auto-mutated). For interface/E2E, gate a SMOKE test ("does the
# app start"), not the
# full suite — the full suite mixes green tests with known-bug repros, so it is a
# characterization, not a pass/fail signal. Cite each tier's rules back to the
# project's normative ruleset (docs/INTEGRATION.md §4) so the gate is auditable.
#
# TIMEOUTS (issue #368). A gate command with no bound can hang the Check beat
# indefinitely — the heartbeat keeps printing "… still working", so a genuinely hung
# gate never LOOKS hung (measured: an advisory row held a Check beat for 19h). Give a
# row `timeout_secs = N` (wall-clock seconds), and/or set a `[gates]`-level fallback:
#   [gates]
#   default_timeout_secs = 3600  # one hour, for every row without its own bound
# On expiry the command's whole process group is terminated and the row is recorded
# UNVERIFIABLE ("gate exceeded its Ns timeout") → SUMMARY §6 NEEDS-HUMAN — the oracle
# did not answer, which is not a pass/fail verdict. `timeout_secs = 0` on a row opts
# that row out of the fallback; nothing configured ⇒ unbounded, exactly as before.
#
# DELEGATED GATES (issue #67). If your project already single-sources its gates in its
# own runner, point `runner` at it and give each check a bare `subcmd` instead of a full
# `cmd`; PDCA runs `<runner> <subcmd>` and treats the host runner as the source of truth
# (it never re-declares the gates). A missing runner surfaces as a clear failing row, not
# a crash. A full `cmd` (e.g. `cmd = "cargo xtask ci"`) still works for wholesale delegation.
#
# The reference comments above document the keys; this instance's actual [gates] table is
# further down, after the [[doctor.checks]] rows — the template ships a bare header here and
# a second one would be a duplicate-table TOML error.

