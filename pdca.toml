hint = "cargo install cargo-mutants --locked — the advisory C5-mutants row runs surviving-mutant analysis on the bundle diff (getwyrd/wyrd#622)"
level = "WARN"

# --- diff coverage for the advisory C4-diff-cov gate row (#197). TWO things must be present,
#     and the probe checks both, because they fail differently: the cargo subcommand, and the
#     llvm-tools component of the toolchain ../wyrd/rust-toolchain.toml pins (1.96.0, whose
#     `components` list has only rustfmt and clippy — and this out-of-tree project must not edit
#     that file, so the component is a HOST prerequisite, exactly what a doctor row is for).
#     Missing the component is the nastier half: cargo-llvm-cov's own response is an interactive
#     "Proceed? [Y/n]" prompt, and a gate that blocks on stdin does not fail — it hangs until the
#     7200s timeout kills it. The gate guards against that itself; this row is how you find out
#     before a cycle rather than during one.
#
#     The `cd` is load-bearing, and was wrong on the first cut (#197 review). doctor runs each
#     cmd with cwd = THIS project root, where rustup resolves the DEFAULT toolchain — but the
#     gate builds in a worktree of ../wyrd, whose rust-toolchain.toml pins 1.96.0. Those differ
#     on this very host (clippy: absent on the default, present on 1.96.0), so probing from here
#     could report green while every C4-diff-cov run came back UNVERIFIABLE — the exact inversion
#     of the row's purpose. The `! command -v rustup` arm is the other half: on a distro or nix
#     Rust there is no rustup to ask, the gate deliberately falls through and works, so warning
#     there would be a WARN on a host that is fine.
[[doctor.checks]]
group = "engine"
id = "cargo-llvm-cov"
cmd = "cargo llvm-cov --version >/dev/null && { ! command -v rustup >/dev/null || (cd \"${WYRD_REPO:-../wyrd}\" && rustup component list --installed | grep -q '^llvm-tools'); }"
hint = "cargo install cargo-llvm-cov --locked, then rustup component add llvm-tools-preview --toolchain 1.96.0 (the channel ../wyrd/rust-toolchain.toml pins) — the advisory C4-diff-cov row scores how much of the bundle diff the shipped test executes; without both it can only report UNVERIFIABLE"
level = "WARN"

# --- the ADR-0003 dependency wall's own tooling (2026-08-02). Unlike the prose gates above,
#     `cargo xtask ci` does NOT warn-skip a cargo-deny that is present but too OLD: it hard-fails
#     the gating C4-ci row, and the message it fails with ("unexpected argument '--config' found")
#     names a flag, not a version, so the failure reads like a defect in the patch under test.
#
#     What happened: cargo-deny 0.20.0 (2026-07-09, PR#881) moved `--config` from a `check`
#     option INTO THE ROOT; wyrd's xtask adopted the root form five days later
#     (xtask/src/lib.rs::dependency_wall_invocations, commit 7258fec). CI installs
#     `cargo-deny@latest` (0.20.2, green), but this host still had 0.19.9 after a home migration
#     — so C4-ci went red on issue_651 AND issue_652 for a reason that was in neither patch, cost
#     651 a Do iteration, and was one sign-off away from buying a needless further split.
#
#     The probe is the CLI SHAPE, not a version number: root `--config` parses iff the tool is
#     new enough for wyrd's invocation. `--help` short-circuits before the config path is read,
#     so the nonexistent path is never opened and nothing is resolved or fetched — O(1), offline.
[[doctor.checks]]
group = "engine"
id = "cargo-deny"
cmd = "cargo deny --config /nonexistent/deny.toml check --help >/dev/null"
hint = "cargo install cargo-deny --locked (needs >= 0.20.0) — `cargo xtask ci`'s ADR-0003 dependency wall passes `--config` at the ROOT (xtask/src/lib.rs), which 0.19.x rejects outright; the gating C4-ci row then fails on every bundle with a message that names a flag rather than the stale tool"
level = "WARN"

[[doctor.checks]]
group = "engine"
id = "cargo-machete"
cmd = "cargo-machete --version"
hint = "cargo install cargo-machete --locked — the unused-dependency leg of `cargo xtask ci` (ADR-0003 §2). Absent it warn-skips LOCALLY but is enforced in CI, so a bundle can go green here and open the PR red (the same laptop/CI asymmetry as the prose gates above)"
level = "WARN"

# --- host limits (#199): preflight the failure that already cost a 3d 19h run — a headless leaf
#     that builds without a memory bound. O(1), like every row here.
#
# RE-AIMED at v0.57.0, not retired. It used to probe the instance's own systemd-run argv prefix,
# where a host that could not delegate the memory controller made the reviewer leaf die at
# startup — a loud failure. `[driver].leaf_memory_max` (#420) replaced that prefix and fails the
# OTHER way: on such a host the driver degrades to an unwrapped spawn with one note on stderr.
# Safer, and much easier to miss. So the question this row answers has changed from "will the
# leaf start?" to "is the 16G bound I configured actually being applied, or am I unbounded and
# one note away from the 2026-08-02 oomd kill again?" — which is why it is still here.
[[doctor.checks]]
group = "host limits (#199)"
id = "leaf memory bound applies"
# What the driver itself runs to wrap a leaf, on /bin/true. Fails when the memory controller is
# not delegated to the user manager, or there is no user manager at all (bare ssh exec, a
# container) — exactly the conditions under which leaf_memory_max silently becomes a no-op.
cmd = "systemd-run --user --scope --quiet --collect -p MemoryMax=64M -- true"
hint = "[driver].leaf_memory_max = \"16G\" is configured but this host cannot open a user scope, so every leaf spawns UNBOUNDED (the driver says so once on stderr and continues). Check: cat /sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/cgroup.controllers — needs `memory`. Run under a real login session, or accept unbounded leaves knowing two concurrent reviewers once took the whole session with them"
level = "WARN"

[[doctor.checks]]
group = "leaf scratch (#200)"
id = "orphaned leaf scratch"
# Leaf scratch is bundle-scoped and reclaimed at the publish/freeze boundary (#200), so a
# steady state has only in-flight bundles' dirs. What this row reports is the residue of runs
# that DIED before reaching that boundary — the 2026-08-02 SIGKILL being the case in point.
# It asks the engine rather than reimplementing the rule in shell: same pid-stamp logic, so a
# dir belonging to a concurrent flow is never miscounted as garbage. O(1) — one depth-1 glob,
# never a `du` over a root that has been 96 GB (the #297 rule).
cmd = "PYTHONPATH=src python3 -c \"import sys; from pathlib import Path; from pdca_harness.config import Config; from pdca_harness import scratch; n=len(scratch.orphans(Config.load(Path('.')))); print(f'{n} orphaned scratch dir(s)') if n else None; sys.exit(1 if n else 0)\""
hint = "crash leftovers in [driver].scratch_dir whose owning process is gone — `pdca sweep` reclaims them. Expected after a hard kill; if it recurs on clean runs, the publish/freeze reclaim in sweep() is not firing (#200)"
level = "WARN"

# Deterministic Check gates (docs 04). A check PASSES iff its command exits 0. `scope = "repo"`
# runs against the working tree (what CI re-runs via `pdca gates --working-tree`); `scope =
# "bundle"` gets $PDCA_BUNDLE and runs only locally. $PDCA_WORKTREE is the isolated tree Do
# edited — a bundle-scoped gate should test THAT, not the host checkout.
#
# GATING POLICY (learned the hard way): a tier ships ADVISORY (gating = false) by default. The
# per-fix red→green C4 is the one that ships gating = true, because the runtime / conformance /
# interface tiers all audit code the CURRENT fix did not introduce, so gating them on
# pre-existing non-conformance is wrong. `promote_after = N` earns the promotion: `pdca gates
# --promotions` lists advisory checks that passed their N most-recent frozen cycles, and you flip
# `gating` by hand. Each tier cites its rules back to docs/INTEGRATION.md §4.
#
# DELEGATED (issue #67): Wyrd single-sources every gate definition in `cargo xtask` (ADR-0016) and
# PDCA never re-declares them, so `runner` is the engine/xtask.sh wrapper (it cd's into the
# sibling Wyrd checkout, since gates run from THIS project's root) and a check gives a bare
# `subcmd`. A full `cmd` still works for anything outside that runner.
[gates]
runner = "./engine/xtask.sh"
# Confirm-once on a failed GATING row (staged locally, pending eduralph/pdca-harness#371).
# A gating row is otherwise a single sample of a substrate that is not the patch: bundle
# 648's C4-ci recorded `cargo test` exit 101 in ~90s of a step that runs ~7 minutes green,
# was green in all six prior rounds and green on every re-run — and that one sample parked
# the bundle. On a fail the gate re-runs ONCE and records BOTH verdicts: fail→fail stays
# red; fail→pass records the pass flagged `flaky` with a §6 item the human must clear, and
# both runs' full output lands in the bundle's gate-logs/ (#370). Never applied to the
# model leaves — this re-samples a deterministic oracle and keeps both samples, not a
# nondeterministic reviewer keeping one. A model-backed gate ROW opts out the same way:
# `confirm_fail = false` on the check (see T4-batch-review below).
confirm_gating_fail = true
# Wall-clock bound for any check that doesn't set its own `timeout_secs` (issue #187).
# 2h is generous against the slowest honest row here — a full `cargo xtask ci` including
# DST, from a cold target dir — while still catching a genuine hang in hours instead of
# never. A gate that outruns it is killed (whole process group) and recorded
# `unverifiable`, never `fail`: it gave no verdict, so it has none to hold against the fix.
# Set because issue_635's advisory C5-mutants row hung for 19h16m on a target-side test
# deadlock (getwyrd/wyrd#646) and held the entire Check beat while the heartbeat ticked.
default_timeout_secs = 7200
checks = [
  # The whole Wyrd gate, wholesale: fmt + clippy -D warnings + build + test (incl. DST) +
  # cargo-deny + conformance vectors, run identically on laptop and CI. The single source of gate
  # truth, hence the one gating repo-scoped row; the per-fix discriminator is C4-verify below.
  { id = "C4-ci", tier = "C4", label = "Wyrd gate: cargo xtask ci (fmt/clippy/build/test/deny/conformance)", subcmd = "ci", gating = true, scope = "repo" },

  # Per-fix red→green — the C4 that validates THIS change, not the whole tree. Applies the
  # bundle's patch.diff in an isolated ../wyrd-verify worktree (off main) and runs ONLY the test
  # it ships: green with the fix, red with the production reverted. A co-located test degrades to
  # green-only. Advisory until it has passed 3 consecutive signed cycles (promote_after), which
  # `pdca gates --promotions` then surfaces. Logic unit-tested by engine/tests/test_run_verify.sh.
  { id = "C4-verify", tier = "C4", label = "per-fix red->green: this patch's test red pre-fix, green post-fix", cmd = "./engine/scripts/run-verify.sh", gating = false, scope = "bundle", promote_after = 3 },

  # Diff coverage — how much of THIS patch the shipped test actually executes. The cheap third
  # probe of the bundle diff, between C4-verify (does the test catch the one bug?) and
  # C5-mutants (is any changed code unnoticed if broken?): mutation rebuilds and retests per
  # mutant and once held a Check beat for 19h16m, while this is one instrumented build plus one
  # test run, so it can afford to run every cycle. It also splits what a surviving mutant
  # cannot: an uncovered line is a REACH gap, a covered-but-unasserted one a STRENGTH gap, and
  # only the first is this row's to report. And it scores every instrumentable changed line,
  # where cargo-mutants only scores lines it has mutation patterns for — parts of a diff pass
  # there with zero mutants generated.
  #
  # Scores EVERY changed crate, not just the one shipping the test — one cargo run per package
  # (`--test <name>` filters targets across all of them, so a single combined invocation runs
  # nothing for the others), merged into one report. A crate the report does not mention at all
  # is UNVERIFIABLE, never a silent omission: measuring one crate of a two-crate patch and
  # dropping the rest reported 100% on a patch whose second crate was never compiled.
  #
  # Runs in its own ../wyrd-cov worktree, NOT C4-verify's: llvm-cov builds under
  # `-C instrument-coverage`, so one shared checkout would have the two gates invalidating each
  # other's build cache every cycle. Both the worktree and its branch are $PDCA_LANE-scoped.
  # Advisory per the policy above, and on the same promote_after = 3 ladder C4-verify is on — a
  # coverage floor is a judgement about test design, so it earns the right to block by holding
  # over three signed cycles first. Needs cargo-llvm-cov + the toolchain's llvm-tools; without
  # either it reports UNVERIFIABLE (never a fail — a missing tool is no verdict on the patch),
  # and [[doctor.checks]] 'cargo-llvm-cov' makes that visible up front. The floor is
  # $WYRD_DIFFCOV_MIN, default 80. Logic unit-tested by engine/tests/test_run_diff_cov.sh.
  { id = "C4-diff-cov", tier = "C4", label = "diff coverage: changed lines executed by the patch's tests", cmd = "./engine/scripts/run-diff-cov.sh", gating = false, scope = "bundle", promote_after = 3 },

  # Batched multi-pass rubric review — the pre-PR review made identical to the PR review: N
  # parallel codex passes over the bundle's patch.diff, each armed with the target's AGENTS.md
  # "Review rubric & protocol", unioned + deduped, rubric-rejected noise dropped. Gating at
  # CHECK: the bundle cannot reach sign-off while BUG-class findings remain untriaged.
  # Findings feed the brief's carry-forward block, and the driver's iterate budgets bound the
  # fix loop. Stopgap for eduralph/pdca-harness#314/#315.
  #
  # `at_publish = false` reverses this row's original intent (#183). It was registered at
  # tier=T4 deliberately, so `pdca publish` would re-run it before any git action; in
  # practice that is the wrong place for it, three times over:
  #   * Check already ran it — publish pays a second ~6 min of model spend per attempt,
  #     and pays it again on every retry;
  #   * it re-samples a NONDETERMINISTIC reviewer after the human has signed off, so a
  #     bundle green at Check can be refused at publish over a finding that did not exist
  #     when §9 was recorded (both of 634's blockers were single-vote and did not
  #     reproduce on the next run);
  #   * it runs captured, so publish looks hung for the whole of it (#181).
  # What belongs at publish is the contribution-artifact check below, whose subject does
  # not exist until publish drafts it. The review stays fully gating at Check.
  # `confirm_fail = false`: this row's command is MODEL-BACKED, so the confirm-once
  # re-run above must never touch it — re-running would re-sample a nondeterministic
  # reviewer, and a second, luckier sample could overwrite real first-run blockers in
  # review-batch.md and pass as "flaky" (the very #634 failure mode recorded at
  # at_publish above). The confirm is for deterministic oracles only.
  { id = "T4-batch-review", tier = "T4", label = "batched multi-pass rubric review (3x codex, union, triaged)", cmd = "scripts/review-branch --bundle", gating = true, scope = "bundle", at_publish = false, confirm_fail = false },

  # The check publish's T4 step was built for: are the contribution artifacts THERE and
  # complete — a non-empty `**User impact:**` opener ahead of Root cause, and the tracker id
  # in BOTH commit-msg.txt and pr-description.md. Presence and shape, not a review of the
  # change. It is the one T4 row whose subject does not exist at Check time, and it is
  # default-open there: no pr-description.md yet ⇒ pass, so the same registration serves
  # both phases (`cli.py:_contribcheck`).
  #
  # Invoked through `scripts/pdca`, NOT a hardcoded `.venv/bin/wyrd-pdca`: this row must
  # resolve the harness under every documented install, and a venv-relative path is only
  # one of them. A source run (`PYTHONPATH=src python -m pdca_harness.cli`) or a pipx /
  # system install has no such file, so the row would exit 127 — a red gate on a harness
  # that is at that moment running fine, on every patch-bearing Check and again at publish
  # (PR #184 review). The launcher tries $PDCA_CLI, then the venv (POSIX, then the
  # `scripts/install.ps1` Windows layout), then this checkout's `src/`, then `wyrd-pdca`
  # on PATH — src ahead of PATH because in a `git worktree` (no .venv of its own) the
  # PATH console script is the MAIN checkout's harness, not this tree's. $PDCA_CLI still
  # overrides outright for a layout it doesn't know. Note the rest of this
  # gate set — `engine/xtask.sh`, `scripts/review-branch`, `scripts/mutants-in-diff` — is
  # POSIX shell already, so Windows needs more than this one row; this at least keeps THIS
  # row from being the reason.
  { id = "T4-contribution", tier = "T4", label = "contribution artifacts complete (user-impact opener + tracker id in both)", cmd = "scripts/pdca contribcheck", gating = true, scope = "bundle" },

  # Surviving mutants on THIS bundle's diff — the mechanical counterpart to the rubric's
  # vacuous-assertion class (tests that pass without binding the property). Advisory per the
  # policy above: a missed mutant is often pre-existing suite debt adjacent to the diff, not this
  # fix's defect. The GitHub-side `mutants-pr` job becomes the gating enforcement once its
  # baseline is clean (getwyrd/wyrd#622).
  { id = "C5-mutants", tier = "C5", label = "surviving mutants on the bundle diff (cargo mutants --in-diff)", cmd = "scripts/mutants-in-diff", gating = false, scope = "bundle" },

  # Finer-grained read-only rows for per-tier reporting, off because `ci` already runs both
  # internally — enabling them re-runs work (dst sweeps 50 seeds). Uncomment to see the tiers as
  # separate evidence lines; they stay pure `cargo xtask` delegations.
  # { id = "T1-conformance", tier = "T1", label = "on-disk format conformance vectors (ADR-0002)", subcmd = "conformance", gating = false, scope = "repo" },
  # { id = "T3-dst",         tier = "T3", label = "deterministic simulation sweep (ADR-0009)",     subcmd = "dst",         gating = false, scope = "repo" },
]


# Host-only CI parity (issue #311). CI jobs the host runs on EVERY PR but the delegated
# gate runner does not cover (a spell-checker like `typos`, a docs lint). The T4 slot runs
# BEFORE patch.diff is applied, so it structurally cannot see prose that arrives in the
# patch — a bundle can pass Check green and open a PR that immediately fails a required
# status. Declare those commands here and the harness runs each one FROM a reconstructed
# base + patch.diff tree, at two seams:
#   * at Check, as gate rows (defaults: tier "T4", bundle scope) against the same lane
#     worktree the bundle-scoped gates trust (#296) — a red lands in check-gates +
#     SUMMARY §6 where sign-off sees it;
#   * again in `pdca publish`, immediately before anything is pushed: the
#     harness re-FETCHES, PINS the exact base commit the push will build on, materializes
#     base + patch.diff in an ephemeral worktree at that commit, runs the commands there,
#     and builds the pushed branch on that same commit — so a green certifies the very
#     tree being pushed even when the base advanced since Check. ANY command that does
#     not pass — any non-zero exit, exit 77 included — blocks the push (no branch, no
#     PR) and is recorded in the bundle's host-ci.json naming the command and the base.
# A bare string is shorthand for { cmd = "..." }; a table row may also set id / label /
# tier. `gating` is forced true (the host's CI will fail the PR on these regardless, so
# an advisory row would re-open the exact observed gap). The target must be a git
# checkout; at Check without a patched worktree the rows read UNVERIFIABLE (→ §6), and
# publish refuses rather than push content the declared CI never saw. Empty / absent
# (the default) ⇒ byte-identical behaviour everywhere.
# WHAT THIS INSTANCE DECLARES, and what it deliberately does NOT.
#
# The headline case — prose gates the T4 slot cannot see — is already closed here. wyrd#598
# folded `typos` and the docs lint/render into `cargo xtask ci` (xtask/src/main.rs: "typos +
# docs lint/render (the prose gates)"), and the C4-ci row runs that in the PATCHED lane
# worktree. A `typos` or docs-lint row would re-run what C4-ci already covers. Not declared.
#
# The genuine gap is the tikv compile. `main`'s required statuses are docs-check,
# require-issue, docs-immutability, dco and `gate` — and `gate` needs the `tikv` job and fails
# the PR when it fails (ci.yml: "A bar that does not fail a PR is not a bar"). That job is the
# one required check nothing local reproduces, and its own comment says why: WYRD_TIKV_TOOLCHAIN
# is "unset everywhere else, which is why a laptop / PDCA worktree never compiles the pre-1.0
# tikv-client tree". So a bundle passes Check green and opens a PR that is immediately red.
#
# The other four required statuses cannot be modelled here and are not meant to be: dco,
# require-issue and docs-immutability read PR metadata or a base..head range, not a tree.
#
# COST, stated plainly: this adds a tikv-tree compile to every Check AND to every publish
# (publish re-runs host_ci in an ephemeral worktree pinned to the exact push base). The tree is
# heavy and was deliberately kept off local machines. `gating` is forced true, so a red blocks
# the push. If the compile costs more than the red PRs it prevents, empty this list again —
# but decide that from a measured Check duration, not in advance.
#
# The two rows are `xtask::feature_gated_checks(tikv: true, ..)` spelled out, exactly as the CI
# job spells them (running `WYRD_TIKV_TOOLCHAIN=1 cargo xtask ci` instead would re-run the
# entire gate — fmt, clippy, tests, deny, conformance — a second time to reach two checks).
# Keep them in step with ci.yml's `tikv` job and xtask's
# `ci_type_checks_feature_gated_metadata_scenario`.
host_ci = [
  { id = "host-tikv", label = "tikv feature compiles (crate + server selection arms)", cmd = "WYRD_TIKV_TOOLCHAIN=1 sh -c 'cargo clippy -p wyrd-metadata-tikv --features tikv --tests && cargo clippy -p wyrd-server --features tikv,etcd --tests'" },
]

# Reverse registry-consistency (issue #205). The FORWARD direction (a source file a patch
# adds must be registered in a manifest) is a project gate; this is the REVERSE, generic in
# the harness: every line a patch ADDS to one of these manifest files must reference a path
# the SAME patch touches. A registry line pointing at a file the patch never touches is
# cross-bundle / build-tree contamination — the stored patch then fails to apply to its clean
# publish base, yet passes Check. Name your manifest files here and wire the bundle-scoped
# `registry-check` gate below; `pattern` (optional) is a regex whose first group extracts the
# path from a non-bare-path manifest line (e.g. "^include (.+)$" for a MANIFEST.in) — omit for
# bare-path manifests like POTFILES (the whole line is the path; blank / `#` lines ignored).
# [gates.registry_consistency]
# files = ["po/POTFILES.in", "po/POTFILES.skip"]
# # pattern = "^include (.+)$"
#
# Then wire it as a bundle-scoped gate (T2 Shape). `registry-check` reads $PDCA_BUNDLE:
# [[gates.checks]]
# id = "T2-registry-reverse"
# tier = "T2"
# label = "manifest lines reference only paths the patch touches"
# cmd = "pdca registry-check"
# gating = true
# scope = "bundle"

